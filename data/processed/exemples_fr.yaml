# Exemples d'entraînement écrits par l'équipe (Banking77 n'est pas traduit).
#
# - 8 nouvelles intentions : environ 60 phrases en français et 15 en anglais
#   chacune. Les phrases anglaises évitent que la langue devienne un indice :
#   sans elles, le classifieur apprendrait « français = nouvelle intention ».
# - Familles Banking77 : 8 phrases françaises par famille, étiquetées avec une
#   intention Banking77 ; elles ancrent le français du côté du service.
#
# Aucune de ces phrases n'est dans le test français (data/processed/test_fr.yaml).
# Registres variés : poli, familier, fautes, sans accents, phrases longues.

