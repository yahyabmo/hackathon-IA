<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistant bancaire frugal</title>
<script>
// Vue et thème décidés avant le premier rendu : pas d'éclair de la mauvaise vue.
(function () {
  const r = document.documentElement, p = new URLSearchParams(location.search);
  let vue = p.has('utilisateur') ? 'utilisateur' : p.has('demo') ? 'demo' : null, mode = null;
  try { vue = vue || localStorage.getItem('assistant_vue'); mode = localStorage.getItem('assistant_mode'); } catch (e) {}
  r.dataset.vue = vue === 'utilisateur' ? 'utilisateur' : 'demo';
  if (mode === 'sombre') r.dataset.mode = 'sombre';
})();
</script>
<style>
@font-face{font-family:'Inter';font-style:normal;font-weight:400 700;font-display:swap;src:url('/static/polices/inter-latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
@font-face{font-family:'Inter';font-style:normal;font-weight:400 700;font-display:swap;src:url('/static/polices/inter-latin-ext.woff2') format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;}
@font-face{font-family:'ArchivoExp';font-style:normal;font-weight:400 700;font-display:swap;font-stretch:125%;src:url('/static/polices/archivo-exp-latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
@font-face{font-family:'ArchivoExp';font-style:normal;font-weight:400 700;font-display:swap;font-stretch:125%;src:url('/static/polices/archivo-exp-latin-ext.woff2') format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;}

/* Thème de l'interface Timso AI : « Bordeaux & lin », Archivo Expanded aux titres, Inter au corps. */
:root{
  --encre:#241c21; --gris:#6e6469; --gris-clair:#807479;
  --trait:#e8e1de; --sable:#fbf8f6; --blanc:#fff;
  --accent:#7a2e3f; --accent-clair:#f7ecee;
  --ok:#3a6b4c; --alerte:#9c5510;
  --large:1560px;
  --serif:'ArchivoExp',"Arial Black",Impact,sans-serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  /* Les trois niveaux de l'aiguilleur, pris dans les teintes du thème. */
  --n0:var(--ok); --n1:var(--alerte); --n2:var(--accent);
}
[data-mode="sombre"]{
  --encre:#ede5e7; --gris:#a0959a; --gris-clair:#847981;
  --trait:#332c31; --sable:#1e1a1d; --blanc:#161315;
  --accent:#d98a9c; --accent-clair:#2e2025;
  --ok:#7fbe9c; --alerte:#d99a54;
}

*{box-sizing:border-box}
body{margin:0;background:var(--blanc);color:var(--encre);font-family:var(--sans);
     font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.18;margin:0;letter-spacing:-.015em}
a{color:var(--accent)}

/* ─── En-tête ─── */
header{border-bottom:1px solid var(--trait);background:var(--blanc);position:sticky;top:0;z-index:10}
.bandeau{max-width:var(--large);margin:0 auto;padding:14px clamp(16px,2.4vw,34px);
         display:flex;align-items:center;gap:clamp(12px,1.8vw,26px);flex-wrap:wrap}
.marque{font-family:var(--serif);font-size:21px;letter-spacing:-.3px;font-weight:600;color:var(--encre);
        white-space:nowrap}
.marque span{color:var(--accent)}
.outils{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* L'interrupteur de vue : deux boutons collés, celui qui est actif prend l'accent. */
.bascule{display:inline-flex;border:1px solid var(--trait);border-radius:10px;padding:3px;background:var(--sable)}
.bascule button{background:none;border:none;font-family:var(--sans);font-size:13.5px;color:var(--gris);
                padding:6px 13px;border-radius:7px;cursor:pointer;white-space:nowrap}
.bascule button:hover{color:var(--encre)}
.bascule button[aria-pressed="true"]{background:var(--accent-clair);color:var(--accent);font-weight:600}
.lien{background:none;border:none;font-family:var(--sans);font-size:13.5px;color:var(--gris);
      padding:6px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.lien:hover{background:var(--sable);color:var(--encre)}

/* ─── Boutons ─── */
.btn{background:var(--accent);color:var(--blanc);border:none;border-radius:9px;padding:11px 22px;
     font-size:14.5px;font-weight:600;cursor:pointer;font-family:var(--sans)}
.btn:hover{filter:brightness(1.07);transform:scale(1.035)}
.btn:active{transform:scale(.975)}
.btn:disabled{opacity:.45;cursor:default;filter:none;transform:none}
.btn.doux{background:var(--blanc);color:var(--encre);border:1px solid var(--trait)}
.btn.doux:hover{background:var(--sable);filter:none}
.btn.petit{padding:7px 14px;font-size:13px}
@media(prefers-reduced-motion:no-preference){
  .btn{transition:filter .14s ease,background .14s ease,transform .16s cubic-bezier(.2,.7,.3,1)}
}

/* ─── Mise en page : réglages à gauche, conversation à droite ─── */
main{width:100%;max-width:var(--large);margin:0 auto;padding:clamp(18px,2.2vw,30px) clamp(16px,2.4vw,34px) 0}
.atelier{display:grid;gap:clamp(14px,1.6vw,22px);align-items:start}
@media(min-width:1100px){
  .atelier{grid-template-columns:340px minmax(0,1fr)}
  .reglages{position:sticky;top:86px;max-height:calc(100vh - 100px);overflow-y:auto}
}
[data-vue="utilisateur"] .atelier{grid-template-columns:minmax(0,1fr)}
[data-vue="utilisateur"] .demo-seul{display:none !important}
[data-vue="demo"] .utilisateur-seul{display:none !important}
[data-vue="utilisateur"] .conversation{max-width:820px;margin:0 auto;width:100%}

.carte{border:1px solid var(--trait);border-radius:14px;padding:20px;background:var(--blanc);margin-bottom:14px}
.etiquette{font-size:11.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--gris);font-weight:600;
           margin-bottom:9px}
textarea,select{width:100%;font-family:var(--sans);font-size:14.5px;color:var(--encre);background:var(--blanc);
  border:1px solid var(--trait);border-radius:9px;padding:10px 13px;outline:none;-webkit-appearance:none;appearance:none}
textarea:focus,select:focus{border-color:var(--accent)}
select{cursor:pointer}
.case{display:flex;align-items:center;gap:9px;font-size:14px;margin-top:10px;cursor:pointer}
.case input{accent-color:var(--accent);width:16px;height:16px}
.profil{display:grid;grid-template-columns:minmax(0,9rem) minmax(0,1fr);gap:2px 12px;font-size:13.5px;margin-top:12px}
.profil dt{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--gris);font-weight:600;padding-top:3px}
.profil dd{margin:0}
.profil .nom{grid-column:1/-1;font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:6px}
.profil i{color:var(--alerte);font-style:normal;font-size:11.5px}
.exemples{border:1px solid var(--trait);border-radius:11px;overflow:hidden}
.exemples button{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--trait);
  font-family:var(--sans);font-size:13.5px;color:var(--encre);padding:9px 13px;cursor:pointer}
.exemples button:last-child{border-bottom:none}
.exemples button:hover{background:var(--sable);color:var(--accent)}
.stat{font-size:13.5px;color:var(--gris);line-height:1.8}
.stat b{color:var(--encre)}
.chaine{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:4px 0 6px}
.ok{color:var(--ok)} .ko{color:var(--alerte)}

/* ─── Pastilles de niveau ─── */
.niv{display:inline-block;font-size:12px;padding:3px 11px;border-radius:20px;border:1px solid;white-space:nowrap;font-weight:600}
.niv.n0{color:var(--n0);border-color:var(--n0);background:color-mix(in srgb,var(--n0) 9%,transparent)}
.niv.n1{color:var(--n1);border-color:var(--n1);background:color-mix(in srgb,var(--n1) 9%,transparent)}
.niv.n2{color:var(--n2);border-color:var(--n2);background:color-mix(in srgb,var(--n2) 9%,transparent)}
.chaine .niv{padding:1px 8px;font-size:11.5px}

/* ─── Conversation ─── */
.conversation{display:flex;flex-direction:column;min-height:calc(100vh - 120px)}
#fil{flex:1;display:flex;flex-direction:column;gap:18px;padding-bottom:20px}
.accueil{border:1px dashed var(--trait);border-radius:14px;padding:clamp(30px,5vw,54px) 24px;text-align:center;
         color:var(--gris);font-size:14.5px;line-height:1.75}
.accueil h2{font-size:22px;color:var(--encre);margin-bottom:10px}
.bulle{align-self:flex-end;max-width:min(640px,86%);background:var(--accent);color:var(--blanc);
       padding:10px 16px;border-radius:14px 14px 4px 14px;white-space:pre-wrap;font-size:14.5px}
.reponse{align-self:flex-start;width:100%;max-width:900px;background:var(--sable);border:1px solid var(--trait);
         border-left:3px solid var(--accent);border-radius:0 14px 14px 0;overflow:hidden}
[data-vue="utilisateur"] .reponse{width:auto;max-width:min(680px,92%);border-left:1px solid var(--trait);
         border-radius:14px 14px 14px 4px}
.reponse .texte{padding:15px 19px;white-space:pre-wrap;line-height:1.68;font-size:14.5px}
.reponse .texte sup{color:var(--accent);font-weight:600}
.reponse .sources-mini{padding:0 19px 13px;font-size:12.5px;color:var(--gris)}
.meta{padding:9px 19px;border-top:1px solid var(--trait);font-size:12.5px;color:var(--gris);
      display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:var(--blanc)}
.meta .co2{color:var(--ok);font-weight:600}
.avis{margin:0 19px 12px;border-left:3px solid var(--alerte);padding:3px 0 3px 13px;color:var(--alerte);font-size:13px}
details.replie{border-top:1px solid var(--trait);background:var(--blanc)}
details.replie summary{cursor:pointer;color:var(--gris);font-size:13.5px;list-style:none;padding:9px 19px;user-select:none}
details.replie summary::-webkit-details-marker{display:none}
details.replie summary::before{content:"+ ";color:var(--accent)}
details.replie[open] summary::before{content:"– "}
details.replie summary:hover{color:var(--encre)}
.ligne{padding:9px 19px;border-top:1px solid var(--trait);font-size:13.5px;line-height:1.55}
.ligne .h{display:flex;justify-content:space-between;gap:12px;font-size:11px;text-transform:uppercase;
          letter-spacing:.7px;color:var(--gris);font-weight:600;margin-bottom:3px}
.ligne .sc{color:var(--accent);font-variant-numeric:tabular-nums;text-transform:none;letter-spacing:0}
.muted{color:var(--gris);font-size:12.5px}
table.etapes{width:100%;border-collapse:collapse;font-size:12.5px}
table.etapes td{padding:6px 19px;border-top:1px solid var(--trait);color:var(--gris);font-variant-numeric:tabular-nums}
.attente{align-self:flex-start;color:var(--gris);font-size:13.5px;display:flex;align-items:center;gap:9px}
.spin{width:13px;height:13px;border:2px solid var(--trait);border-top-color:var(--accent);border-radius:50%;
      display:inline-block;animation:tourne .7s linear infinite}
@keyframes tourne{to{transform:rotate(360deg)}}
.points span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gris-clair);margin-right:4px;
             animation:saute 1.1s ease-in-out infinite}
.points span:nth-child(2){animation-delay:.15s} .points span:nth-child(3){animation-delay:.3s}
@keyframes saute{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}

/* ─── Saisie, accrochée en bas, avec la barre de scénario au-dessus ─── */
.pied{position:sticky;bottom:0;background:var(--blanc);border-top:1px solid var(--trait);padding:12px 0 18px}
form#saisie{display:flex;gap:10px;align-items:flex-end}

/* La barre de scénario : le prochain message de la démonstration, envoyé d'un clic ou de la flèche →. */
.scenario{background:var(--sable);border:1px solid var(--trait);border-left:3px solid var(--accent);
          border-radius:0 14px 14px 0;padding:11px 15px;margin-bottom:12px}
.scenario[hidden]{display:none}
.sc-haut{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:9px}
.sc-haut .etiquette{margin:0;color:var(--accent)}
.sc-haut .bascule{background:var(--blanc)}
.sc-progres{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--gris);
            font-variant-numeric:tabular-nums}
.sc-points{display:flex;gap:4px}
.sc-points i{width:8px;height:8px;border-radius:50%;background:var(--trait);display:block}
.sc-points i.fait{background:var(--ok)}
.sc-points i.cours{background:var(--accent);animation:bat 1.4s ease-in-out infinite}
@keyframes bat{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.45);opacity:.6}}
.sc-bas{display:flex;gap:10px;align-items:center}
.sc-prochain{flex:1;min-width:0;text-align:left;font-family:var(--sans);font-size:14px;color:var(--encre);
             background:var(--blanc);border:1px dashed var(--trait);border-radius:9px;padding:9px 13px;cursor:text;
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-prochain:hover{border-color:var(--accent)}
.sc-prochain .quoi{color:var(--gris);font-size:12px;text-transform:uppercase;letter-spacing:.7px;font-weight:600;margin-right:8px}
.sc-fermer{background:none;border:none;color:var(--gris);font-size:18px;line-height:1;cursor:pointer;padding:2px 6px;border-radius:6px}
.sc-fermer:hover{background:var(--blanc);color:var(--encre)}
.lien[aria-pressed="true"]{background:var(--accent-clair);color:var(--accent);font-weight:600}
/* En vue utilisateur, la barre se réduit à une pastille discrète, en bas à droite. */
.sc-pastille{position:fixed;right:clamp(16px,2.4vw,34px);bottom:96px;z-index:5;background:var(--accent);color:var(--blanc);
             border:none;border-radius:20px;padding:8px 15px;font-family:var(--sans);font-size:13px;font-weight:600;
             cursor:pointer;box-shadow:0 6px 20px -10px color-mix(in srgb,var(--encre) 55%,transparent)}
.sc-pastille[hidden]{display:none}
.sc-pastille:disabled{opacity:.5;cursor:default}
form#saisie textarea{resize:none;min-height:46px;max-height:160px;line-height:1.5}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .spin{animation-duration:1.6s !important;animation-iteration-count:infinite !important}
  .btn:hover,.btn:active{transform:none}
}
</style>
</head>
<body>
<header>
  <div class="bandeau">
    <div class="marque">Assistant <span>bancaire</span></div>
    <div class="outils">
      <div class="bascule" role="group" aria-label="Vue">
        <button type="button" data-vue="demo">Démo : tout voir</button>
        <button type="button" data-vue="utilisateur">Utilisateur : les messages</button>
      </div>
      <button type="button" class="lien" id="scenarios" aria-pressed="false">Scénarios</button>
      <button type="button" class="lien" id="theme">Mode sombre</button>
      <button type="button" class="btn doux petit" id="nouvelle">Nouvelle conversation</button>
    </div>
  </div>
</header>

<main>
  <div class="atelier">
    <aside class="reglages demo-seul">
      <div class="carte">
        <div class="etiquette">Profil simulé</div>
        <select id="client"></select>
        <dl class="profil" id="profil">Chargement…</dl>
      </div>
      <div class="carte">
        <div class="etiquette">Aiguillage</div>
        <select id="aiguillage">
          <option value="">Automatique : le plus petit qui suffit</option>
          <option value="0">Forcer le niveau 0 : règles</option>
          <option value="1">Forcer le niveau 1 : petit LLM interprète</option>
          <option value="2">Forcer le niveau 2 : RAG et rédaction</option>
        </select>
        <label class="case"><input type="checkbox" id="llm"> LLM actif (niveaux 1 et 2)</label>
        <label class="case"><input type="checkbox" id="simple"> Mots simples</label>
      </div>
      <div class="carte">
        <div class="etiquette">Exemples pour ce profil</div>
        <div class="exemples" id="exemples"></div>
      </div>
      <div class="carte">
        <div class="etiquette">Cette conversation</div>
        <div class="stat" id="stat">Aucun message.</div>
      </div>
      <div class="carte">
        <div class="etiquette">Système</div>
        <div class="stat" id="etat">Chargement…</div>
      </div>
    </aside>

    <section class="conversation">
      <div id="fil"></div>
      <div class="pied">
        <div class="scenario demo-seul" id="scenario" hidden>
          <div class="sc-haut">
            <span class="etiquette">Scénario</span>
            <div class="bascule" id="sc-choix" role="group" aria-label="Scénario"></div>
            <div class="sc-progres"><span class="sc-points" id="sc-points"></span><span id="sc-compte"></span></div>
            <button type="button" class="sc-fermer" id="sc-fermer" title="Masquer (Échap)">×</button>
          </div>
          <div class="sc-bas">
            <button type="button" class="sc-prochain" id="sc-prochain" title="Mettre dans la zone de saisie, sans envoyer"></button>
            <button type="button" class="btn" id="sc-envoyer" title="Taper et envoyer (flèche →)">Envoyer ›</button>
          </div>
        </div>
        <button type="button" class="sc-pastille utilisateur-seul" id="sc-pastille" hidden title="Taper et envoyer le prochain message (flèche →)"></button>
        <form id="saisie">
          <textarea id="q" rows="1" placeholder="Votre message… par exemple : j'ai perdu ma carte et je veux faire un virement."></textarea>
          <button class="btn" id="envoyer" type="submit">Envoyer</button>
        </form>
      </div>
    </section>
  </div>
</main>

<template id="accueil">
  <div class="accueil">
    <h2>Bonjour !</h2>
    <div class="utilisateur-seul">Je peux vous aider pour votre carte, un virement, des frais, votre épargne
      ou un projet de crédit. Je n'ai aucun accès à votre compte.</div>
    <div class="demo-seul">Écrivez une demande, ou choisissez un exemple à gauche.<br>
      Pour chaque message, l'aiguilleur choisit le plus petit moyen qui suffit :
      <span class="niv n0">niveau 0</span> règles, <span class="niv n1">niveau 1</span> petit LLM qui comprend,
      <span class="niv n2">niveau 2</span> recherche dans nos fiches et rédaction citée.</div>
  </div>
</template>

<script>
const $ = s => document.querySelector(s);
const fil = $('#fil');
const NOMS = {0: 'Niveau 0 · règles', 1: 'Niveau 1 · petit LLM interprète', 2: 'Niveau 2 · RAG et rédaction'};
let SESSION = Math.random().toString(36).slice(2), CONFIG = null, CUMUL = {tours: 0, ms: 0, tokens: 0, wh: 0, co2: 0, llm: 0, chaine: []};

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const nombre = (x, d = 0) => Number(x).toLocaleString('fr-FR', {maximumFractionDigits: d});
const badge = n => `<span class="niv n${n}">${NOMS[n]}</span>`;
// Le CO₂ d'un message est minuscule : en µg sous le milligramme, en mg au-dessus.
const carbone = g => g < 0.001 ? `${nombre(g * 1e6, 0)} µg CO₂e` : `${nombre(g * 1000, g < 0.01 ? 2 : 1)} mg CO₂e`;
const SOURCE_CO2 = () => `Estimation : énergie mesurée par CodeCarbon sur DeepEirb (banc A/B/C), multipliée par ` +
  `${nombre(CONFIG.intensite_carbone, 1)} g CO₂e/kWh, l'intensité du réseau français selon CodeCarbon.`;
const garder = (cle, valeur) => { try { localStorage.setItem(cle, valeur); } catch (e) {} };

// ─── Vue « Démo » (tout) ou « Utilisateur » (les messages seuls), et thème clair ou sombre ───
function vue(v) {
  document.documentElement.dataset.vue = v;
  document.querySelectorAll('.bascule button').forEach(b => b.setAttribute('aria-pressed', b.dataset.vue === v));
  garder('assistant_vue', v);
}
document.querySelectorAll('.bascule button').forEach(b => b.onclick = () => vue(b.dataset.vue));
vue(document.documentElement.dataset.vue);
function majTheme() { $('#theme').textContent = document.documentElement.dataset.mode === 'sombre' ? 'Mode clair' : 'Mode sombre'; }
$('#theme').onclick = () => {
  const r = document.documentElement;
  if (r.dataset.mode === 'sombre') delete r.dataset.mode; else r.dataset.mode = 'sombre';
  garder('assistant_mode', r.dataset.mode || 'clair'); majTheme();
};
majTheme();

async function chargerConfig() {
  CONFIG = await (await fetch('/api/config')).json();
  $('#client').innerHTML = CONFIG.clients.map(c => `<option value="${c.id}">${c.id} — ${esc(c.libelle)}</option>`).join('');
  $('#client').value = 'C01';
  $('#llm').checked = CONFIG.llm.actif && CONFIG.llm.joignable;
  $('#etat').innerHTML =
    `LLM : ${CONFIG.llm.joignable ? '<span class="ok">serveur joignable</span>' : '<span class="ko">serveur injoignable</span>'}` +
    `<br>Niveau 1 : <b>${esc(CONFIG.llm.niveau1)}</b> · niveau 2 : <b>${esc(CONFIG.llm.niveau2)}</b>` +
    `<br>Classifieur : ${CONFIG.classifieur.disponible ? 'e5-small et régressions, τ = ' + nombre(CONFIG.classifieur.tau, 2) : 'absent'}` +
    `<br>RAG : ${CONFIG.rag.fiches} fiches sourcées${CONFIG.rag.disponible ? '' : ' (index absent)'}`;
  // ?client=C07&rejouer : rejoue les exemples du profil (démonstration de secours, en direct).
  const params = new URLSearchParams(location.search);
  if (params.get('client')) $('#client').value = params.get('client');
  $('#sc-choix').innerHTML = CONFIG.scenarios.map(s =>
    `<button type="button" data-id="${s.id}" title="${esc(s.sujet)}">${s.id} · ${esc(s.titre)}</button>`).join('');
  $('#sc-choix').querySelectorAll('button').forEach(b => b.onclick = () => choisirScenario(Number(b.dataset.id)));
  if (params.get('scenario')) { ouvrirScenarios(true); await choisirScenario(Number(params.get('scenario'))); }
  else await changerClient();
  if (params.has('rejouer')) for (const m of CONFIG.exemples[$('#client').value] || []) await envoyer(m);
}

// ─── Scénarios de la démonstration : le prochain message, tapé puis envoyé d'un clic ───
const SC = {id: null, pas: 0, occupe: false, ouvert: false};
const scenario = () => CONFIG?.scenarios.find(s => s.id === SC.id);

function ouvrirScenarios(ouvert) {
  SC.ouvert = ouvert;
  $('#scenarios').setAttribute('aria-pressed', ouvert);
  majScenario();
}

async function choisirScenario(id) {
  const s = CONFIG.scenarios.find(x => x.id === id);
  if (!s) return;
  SC.id = id;
  $('#client').value = s.client;
  await changerClient();  // nouveau client, nouvelle conversation : le scénario repart du début
}

function majScenario() {
  const s = scenario(), n = s ? s.messages.length : 0, fini = s && SC.pas >= n;
  $('#scenario').hidden = !SC.ouvert;
  $('#sc-pastille').hidden = !SC.ouvert || !s;
  $('#sc-choix').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', Number(b.dataset.id) === SC.id));
  $('#sc-points').innerHTML = s ? s.messages.map((_, i) => `<i class="${i < SC.pas ? 'fait' : i === SC.pas ? 'cours' : ''}"></i>`).join('') : '';
  $('#sc-compte').textContent = s ? `${Math.min(SC.pas, n)} / ${n}` : '';
  $('#sc-prochain').innerHTML = !s ? '<span class="quoi">Choisissez un scénario</span>'
    : fini ? '<span class="quoi">Scénario terminé</span>Nouvelle conversation pour le rejouer.'
    : `<span class="quoi">Prochain</span>« ${esc(s.messages[SC.pas])} »`;
  $('#sc-envoyer').disabled = $('#sc-pastille').disabled = !s || fini || SC.occupe;
  $('#sc-pastille').textContent = !s ? '' : fini ? '✓ terminé' : `▶ ${SC.pas + 1} / ${n}`;
}

// Le message est tapé lettre par lettre dans la zone de saisie (une seconde environ), puis envoyé.
async function scenarioSuivant() {
  const s = scenario();
  if (!s || SC.occupe || SC.pas >= s.messages.length) return;
  const message = s.messages[SC.pas];
  SC.occupe = true; majScenario();
  const q = $('#q'), delai = Math.min(28, 1100 / message.length);
  q.value = '';
  for (const lettre of message) { q.value += lettre; await new Promise(r => setTimeout(r, delai)); }
  await new Promise(r => setTimeout(r, 180));
  q.value = '';
  SC.pas++;
  await envoyer(message);
  SC.occupe = false; majScenario();
}

$('#scenarios').onclick = () => ouvrirScenarios(!SC.ouvert);
$('#sc-fermer').onclick = () => ouvrirScenarios(false);
$('#sc-envoyer').onclick = scenarioSuivant;
$('#sc-pastille').onclick = scenarioSuivant;
$('#sc-prochain').onclick = () => {
  const s = scenario();
  if (s && SC.pas < s.messages.length) { $('#q').value = s.messages[SC.pas]; SC.pas++; majScenario(); $('#q').focus(); }
};
document.addEventListener('keydown', ev => {
  if (!SC.ouvert) return;
  const saisie = document.activeElement === $('#q');
  if (ev.key === 'Escape') { ouvrirScenarios(false); return; }
  if (ev.key === 'ArrowRight' && (!saisie || !$('#q').value)) { ev.preventDefault(); scenarioSuivant(); }
});

async function changerClient() {
  const id = $('#client').value;
  if (scenario() && scenario().client !== id) SC.id = null;  // un autre client : le scénario ne s'applique plus
  const p = await (await fetch('/api/profil/' + id)).json();
  $('#profil').innerHTML = `<div class="nom">${esc(p.prenom)}</div>` + p.champs.map(c =>
    `<dt>${esc(c.libelle)}</dt><dd>${c.valeur === null ? 'inconnu' : esc(typeof c.valeur === 'number' ? nombre(c.valeur) : c.valeur)}${c.simule ? ' <i>simulé</i>' : ''}</dd>`).join('');
  $('#exemples').innerHTML = (CONFIG.exemples[id] || []).map(m => `<button type="button">${esc(m)}</button>`).join('');
  $('#exemples').querySelectorAll('button').forEach(b => b.onclick = () => envoyer(b.textContent));
  await nouvelle();
}

async function nouvelle() {
  await fetch('/api/nouvelle', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({session: SESSION})});
  SESSION = Math.random().toString(36).slice(2);
  CUMUL = {tours: 0, ms: 0, tokens: 0, wh: 0, co2: 0, llm: 0, chaine: []};
  fil.innerHTML = $('#accueil').innerHTML;
  SC.pas = 0;
  majStats(); majScenario();
}

function majStats() {
  if (!CUMUL.tours) { $('#stat').textContent = 'Aucun message.'; return; }
  const par = [0, 1, 2].map(n => CUMUL.chaine.filter(x => x === n).length);
  $('#stat').innerHTML =
    `<b>${CUMUL.tours} message(s)</b><div class="chaine">${CUMUL.chaine.map(n => `<span class="niv n${n}">${n}</span>`).join('→')}</div>` +
    `niveau 0 : ${par[0]} · niveau 1 : ${par[1]} · niveau 2 : ${par[2]}<br>` +
    `appels au LLM : ${CUMUL.llm} · tokens : ${nombre(CUMUL.tokens)}<br>latence totale : ${nombre(CUMUL.ms)} ms` +
    (CONFIG.mesures ? `<br>énergie estimée : ${nombre(CUMUL.wh * 1000, 3)} mWh` +
                      `<br><span title="${esc(SOURCE_CO2())}">carbone estimé : ${carbone(CUMUL.co2)}</span>` : '');
}

function reponse(d) {
  const llmUtilises = [...new Set(d.trace.filter(e => e.appel_llm).map(e => e.modele))];
  const repli = d.trace.find(e => e.appel_llm && /refusé|injoignable/.test(e.modele || ''));
  // Les sources ont leur volet en démo, une ligne discrète pour l'utilisateur.
  const brut = d.sources.length ? d.texte.replace(/\n\nSources : [^\n]*/, '') : d.texte;
  const texte = esc(brut).replace(/\[(\d)\]/g, '<sup>[$1]</sup>');
  const c = d.comprehension;
  let pourquoi = `<div class="ligne"><div class="h"><span>Aiguillage</span></div>${badge(d.niveau)} ${esc(d.raison)}</div>`;
  if (c.intention !== 'inconnue') {
    pourquoi += `<div class="ligne"><div class="h"><span>Compréhension</span><span class="sc">${esc(c.niveau)}</span></div>
      Intention <b>${esc(c.intention)}</b> (${esc(c.famille)})` +
      (c.niveau === 'classifieur' ? ` — confiance ${nombre(c.confiance, 2)} ≥ τ ${nombre(c.tau, 2)}` : '') +
      (c.exemple_proche ? `<div class="muted">Phrase d'entraînement la plus proche : « ${esc(c.exemple_proche)} »</div>` : '') +
      (c.autres.length ? `<div class="muted">Autres demandes, mises en file : ${c.autres.map(esc).join(', ')}</div>` : '') + `</div>`;
  } else if (c.alternatives.length) {
    pourquoi += `<div class="ligne"><div class="h"><span>Hésitation</span></div>${c.alternatives.map(a => `${esc(a.famille)} (${nombre(a.confiance, 2)})`).join(' ou ')} — sous τ</div>`;
  }
  if (d.conseil) {
    d.conseil.propositions.forEach(p => pourquoi += `<div class="ligne"><div class="h"><span class="ok">Proposé</span></div><b>${esc(p.nom)}</b> — ${esc(p.raisons.join(' '))}${p.sources.length ? `<div class="muted">Source : ${p.sources.map(esc).join(' ; ')}</div>` : ''}</div>`);
    d.conseil.ecartees.forEach(e => pourquoi += `<div class="ligne"><div class="h"><span class="ko">Écarté</span><span class="sc">${esc(e.regle || '')}</span></div><b>${esc(e.nom)}</b> — ${esc(e.raison)}</div>`);
    d.conseil.alertes.forEach(a => pourquoi += `<div class="ligne"><div class="h"><span>Alerte</span></div>${esc(a)}</div>`);
    d.conseil.hypotheses.forEach(h => pourquoi += `<div class="ligne"><div class="h"><span>Hypothèse</span></div>${esc(h)}</div>`);
  }
  const sources = d.sources.map(s => `<div class="ligne"><div class="h"><span>Passage ${s.n} · ${esc(s.titre)}</span><span class="sc">${nombre(s.score, 3)}</span></div>
      ${esc(s.texte)}<div class="muted">${esc(s.source)}${s.date ? ' · ' + esc(s.date) : ''}</div></div>`).join('');
  const etapes = d.trace.map(e => `<tr><td>${esc(e.nom)}</td><td>${esc(e.modele || '')}</td><td>${nombre(e.latence_ms, 1)} ms</td><td>${e.tokens ? e.tokens + ' tokens' : ''}</td><td>${e.appel_llm ? 'LLM' : ''}</td></tr>`).join('');
  return `<div class="reponse">
    <div class="texte">${texte}</div>
    ${d.sources.length ? `<div class="sources-mini utilisateur-seul">Sources : ${[...new Set(d.sources.map(s => s.titre))].map(esc).join(' ; ')}</div>` : ''}
    <div class="meta demo-seul">${badge(d.niveau)}<span>${llmUtilises.length ? esc(llmUtilises.join(', ')) : 'aucun LLM'}</span>
      <span>${nombre(d.latence_ms, 1)} ms</span>${d.tokens ? `<span>${d.tokens} tokens</span>` : ''}
      ${d.energie_wh !== null ? `<span>≈ ${nombre(d.energie_wh * 1000, 3)} mWh</span>` : ''}
      ${d.co2_g !== null ? `<span class="co2" title="${esc(SOURCE_CO2())}">≈ ${carbone(d.co2_g)}</span>` : ''}</div>
    ${repli ? `<div class="avis demo-seul">Le garde-fou a écarté la sortie du LLM (${esc(repli.modele)}) : réponse de repli, sûre.</div>` : ''}
    <details class="replie demo-seul"><summary>Pourquoi</summary>${pourquoi}</details>
    ${d.sources.length ? `<details class="replie demo-seul" open><summary>Sources (${d.sources.length})</summary>${sources}</details>` : ''}
    <details class="replie demo-seul"><summary>Étapes mesurées</summary><table class="etapes">${etapes}</table></details>
  </div>`;
}

const enBas = () => window.scrollTo({top: document.body.scrollHeight});

async function envoyer(message) {
  message = (message || '').trim();
  if (!message) return;
  fil.querySelector('.accueil')?.remove();
  fil.insertAdjacentHTML('beforeend', `<div class="bulle">${esc(message)}</div>`);
  const attente = document.createElement('div');
  attente.className = 'attente';
  attente.innerHTML = '<span class="demo-seul"><span class="spin"></span> L\'aiguilleur choisit le niveau…</span>' +
                      '<span class="utilisateur-seul points"><span></span><span></span><span></span></span>';
  fil.appendChild(attente); enBas();
  $('#envoyer').disabled = true;
  try {
    const force = $('#aiguillage').value;
    const r = await fetch('/api/message', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({session: SESSION, client_id: $('#client').value, message,
                            mots_simples: $('#simple').checked, llm_actif: $('#llm').checked,
                            niveau_force: force === '' ? null : Number(force)})});
    const d = await r.json();
    attente.remove();
    fil.insertAdjacentHTML('beforeend', reponse(d));
    CUMUL.tours++; CUMUL.ms += d.latence_ms; CUMUL.tokens += d.tokens; CUMUL.llm += d.appels_llm;
    CUMUL.wh += d.energie_wh || 0; CUMUL.co2 += d.co2_g || 0; CUMUL.chaine = d.chaine;
    majStats();
  } catch (e) {
    attente.innerHTML = '<span class="ko">Erreur : ' + esc(e.message) + '</span>';
  }
  $('#envoyer').disabled = false;
  enBas();
}

$('#saisie').onsubmit = ev => { ev.preventDefault(); const q = $('#q').value; $('#q').value = ''; envoyer(q); };
$('#q').addEventListener('keydown', ev => { if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); $('#saisie').requestSubmit(); } });
$('#client').onchange = changerClient;
$('#nouvelle').onclick = nouvelle;
chargerConfig();
</script>
</body>
</html>
