# Karim : « Je veux un crédit pour acheter une voiture. » — questionner, rester prudent sur l'endettement.
famille: credit
intentions: [credit_conso]
accroche: "Je peux vous aider à y voir clair, avec prudence."
infos:
  revenus_nets:
    type: montant
    source: revenus_nets
    confirmer: "J'ai noté vos revenus de {valeur} nets par mois."
    question: "Quels sont vos revenus nets mensuels ?"
  mensualites_en_cours:
    type: montant
    source: mensualites_credits
    confirmer: "Vous remboursez déjà {valeur} de crédit par mois."
    question: "Remboursez-vous déjà des crédits ? Si oui, combien par mois ?"
  objet:
    type: objet
    defaut: projet
  montant:
    type: montant
    question: "Quel montant souhaitez-vous emprunter ?"
  duree_mois:
    type: duree
    question: "Sur combien de mois souhaitez-vous rembourser ?"
fin:
  type: conseil
  mention_legale: credit
  proposer: transmettre_conseiller
